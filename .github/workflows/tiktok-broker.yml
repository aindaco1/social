name: TikTok Broker

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_broker:
        description: Deploy the Cloudflare Worker broker
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_migrations:
        description: Apply remote D1 migrations before deploy
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  broker-check:
    name: Broker tests and dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run broker tests
        run: npm run tiktok:broker:test

      - name: Validate Wrangler bundle when D1 ID is available
        env:
          TIKTOK_BROKER_D1_DATABASE_ID: ${{ secrets.TIKTOK_BROKER_D1_DATABASE_ID }}
          TIKTOK_BROKER_D1_DATABASE_NAME: ${{ vars.TIKTOK_BROKER_D1_DATABASE_NAME }}
          TIKTOK_BROKER_WORKER_NAME: ${{ vars.TIKTOK_BROKER_WORKER_NAME }}
          PUBLIC_BROKER_BASE_URL: ${{ vars.PUBLIC_BROKER_BASE_URL }}
          TIKTOK_SCOPES: ${{ vars.TIKTOK_SCOPES }}
        run: |
          set -euo pipefail

          if [[ -z "${TIKTOK_BROKER_D1_DATABASE_ID:-}" ]]; then
            echo "Skipping Wrangler dry run because TIKTOK_BROKER_D1_DATABASE_ID is not configured."
            exit 0
          fi

          npm run tiktok:broker:wrangler:check

  broker-deploy:
    name: Deploy broker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_broker == 'true'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Cloudflare deployment setting(s): %s\n' "${missing[*]}" >&2
            printf 'CLOUDFLARE_API_TOKEN must allow Workers deploys and D1 migrations for this account.\n' >&2
            exit 1
          fi

      - name: Prepare broker secret file
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          BROKER_ADMIN_TOKEN: ${{ secrets.BROKER_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          for name in TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TOKEN_ENCRYPTION_KEY BROKER_ADMIN_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing broker Worker secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          secrets_file="$RUNNER_TEMP/tiktok-broker-secrets.env"
          {
            printf 'TIKTOK_CLIENT_KEY=%s\n' "$TIKTOK_CLIENT_KEY"
            printf 'TIKTOK_CLIENT_SECRET=%s\n' "$TIKTOK_CLIENT_SECRET"
            printf 'TOKEN_ENCRYPTION_KEY=%s\n' "$TOKEN_ENCRYPTION_KEY"
            printf 'BROKER_ADMIN_TOKEN=%s\n' "$BROKER_ADMIN_TOKEN"
          } > "$secrets_file"
          chmod 600 "$secrets_file"
          echo "TIKTOK_BROKER_SECRETS_FILE=$secrets_file" >> "$GITHUB_ENV"

      - name: Prepare broker config
        env:
          TIKTOK_BROKER_D1_DATABASE_ID: ${{ secrets.TIKTOK_BROKER_D1_DATABASE_ID }}
          TIKTOK_BROKER_D1_DATABASE_NAME: ${{ vars.TIKTOK_BROKER_D1_DATABASE_NAME }}
          TIKTOK_BROKER_WORKER_NAME: ${{ vars.TIKTOK_BROKER_WORKER_NAME }}
          PUBLIC_BROKER_BASE_URL: ${{ vars.PUBLIC_BROKER_BASE_URL }}
          TIKTOK_SCOPES: ${{ vars.TIKTOK_SCOPES }}
        run: npm run tiktok:broker:config:check

      - name: Apply D1 migrations
        if: inputs.apply_migrations == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run tiktok:broker:migrate

      - name: Deploy broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config workers/tiktok-broker/wrangler.generated.jsonc \
            --secrets-file "$TIKTOK_BROKER_SECRETS_FILE" \
            --keep-vars
